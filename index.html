<style>

.k0{background:#d98a00}.k1{background:var(--ok)}.k2{background:#2a6fb5}
.card{border:1px solid var(--line);border-radius:6px;padding:9px;margin-bottom:8px;font-size:14px}
.card small{color:var(--mut)}
.card .b{margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--acc);color:#231f1c}
.tag.pg{background:var(--ok);color:#fff}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,50px));z-index:8;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);margin-bottom:4px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 14px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs i{font-style:normal;background:var(--acc);color:#231f1c;border-radius:9px;padding:0 6px;margin-left:4px;font-size:12px}
#tk{display:none;font:12px/1.35 "Courier New",monospace;color:#000;background:#fff;padding:2mm}

:root{--bg:#f6f3ee;--card:#fffdf9;--tx:#1f1a17;--mut:#7a7269;--pri:#b3261e;--acc:#c9961a;--line:#e7e1d8;--hd:#1f1a17;--sh:0 1px 2px rgba(31,26,23,.06),0 6px 18px rgba(31,26,23,.06)}

.b{border-radius:10px;height:40px}

.col{background:transparent;border:0;box-shadow:none;padding:0}

.col>h4.k0{border-top-color:#d98a00}.col>h4.k1{border-top-color:var(--ok)}.col>h4.k2{border-top-color:#2a6fb5}
.card{padding:13px}
.tabs{padding:10px 0;gap:8px}
.tabs button{border-radius:999px;padding:9px 16px;background:transparent}

.bar{background:var(--hd);color:#f3eee7}

*{font-family:Nunito,system-ui,sans-serif!important}
:root{--bg:#f7f7f7;--card:#fff;--tx:#3e3e3e;--mut:#717171;--pri:#ea1d2c;--acc:#ea1d2c;--line:#ebebeb;--hd:#fff;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--line:#333;--hd:#1e1e1e;--pri:#ff4455;--acc:#ff4455}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--line:#333;--hd:#1e1e1e;--pri:#ff4455;--acc:#ff4455}
header b{color:var(--pri);font-weight:800}
nav button{color:var(--mut)}nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
h2{font-size:24px;font-weight:800}h3{font-size:18px;font-weight:800}
.tabs{background:var(--card);margin:0 -12px;padding:0 12px;border-bottom:1px solid var(--line);gap:2px}
.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;color:var(--mut);padding:14px 12px;background:transparent}
.tabs button.on{background:transparent;color:var(--pri);border-bottom-color:var(--pri)}
.r{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:8px}
.r b{color:var(--tx);font-weight:700}
.st button{border-color:var(--pri);color:var(--pri)}
.b.p,.bar button{background:var(--pri);color:#fff;border-radius:8px}
.bar{background:var(--card);color:var(--tx);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.box,.card{border:1px solid var(--line);box-shadow:none;border-radius:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;cursor:pointer}
.acc{display:flex;gap:6px}
.ib{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:8px;min-width:34px;height:34px;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
main,.bar{zoom:var(--z,1)}
.tabs{top:calc((env(safe-area-inset-top,0px) + var(--hh,50px))/var(--z,1))}
.im{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--bg)}
.up{cursor:pointer;font-size:20px}
:root[data-c="1"]{--tx:#000;--mut:#222;--line:#000;--bg:#fff;--card:#fff;--hd:#fff;--pri:#a8000f}
@media(prefers-color-scheme:dark){:root[data-c="1"]:not([data-theme="light"]){--tx:#fff;--mut:#eee;--line:#fff;--bg:#000;--card:#000;--hd:#000;--pri:#ff6b78}}
:root[data-c="1"][data-theme="dark"]{--tx:#fff;--mut:#eee;--line:#fff;--bg:#000;--card:#000;--hd:#000;--pri:#ff6b78}
.r span.im{flex:none}.tx{flex:1;min-width:0}.pc{font-size:15px}
.im{width:90px;height:90px;font-size:36px}
textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:15px Nunito,system-ui,sans-serif;margin:3px 0 8px;resize:vertical}
.seg{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--pri);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.sh{max-height:92vh}
.cols{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.col>h4.k3{border-top-color:var(--pri)}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:16px}}
.cap{height:150px;background:linear-gradient(135deg,var(--pri),#ff8a5b) center/cover;margin:-22px -12px 0;border-radius:0 0 14px 14px}
.lj{display:flex;align-items:flex-end;gap:12px;margin:-34px 0 12px 12px}
.lj h1{font-size:22px;font-weight:800;margin:0 0 4px}
.lg{width:72px;height:72px;border-radius:50%;border:3px solid var(--card);background:var(--card);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}
.ch h3{margin:0;font-size:16px}
.ch label{font-size:13px;color:var(--mut);display:flex;align-items:center;white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.gh small{color:var(--mut)}
.ra{flex-wrap:wrap}
.tabs button{max-width:230px;overflow:hidden;text-overflow:ellipsis}
button:disabled{opacity:.5;cursor:not-allowed}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:28px;height:24px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer;font-size:12px;padding:0}
.ch .mv{flex-direction:row}
.ch input{margin:0;font-weight:800;flex:1;min-width:0}
.tl{display:flex;gap:4px;margin-top:8px}
.tl span{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:6px;background:var(--bg);color:var(--mut)}
.tl span.on{background:var(--ok);color:#fff}
.lj h1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Modal de entrega — visual focado em conversão */
.ov{align-items:center!important;justify-content:center;padding:16px;background:rgba(15,15,15,.62);backdrop-filter:blur(3px)}
.sh{width:min(100%,480px);max-height:min(92dvh,820px);overflow-y:auto;overscroll-behavior:contain;background:#fff!important;color:#27272a!important;border:1px solid #f1f1f1;border-radius:16px!important;padding:24px!important;box-shadow:0 24px 70px rgba(0,0,0,.24)!important}
.sh .delivery-title{margin:0 0 16px;text-align:center;color:#27272a;font-size:20px;font-weight:800;line-height:1.25}
.sh .location-btn{display:block;width:100%;min-height:48px;margin:0 0 10px;padding:13px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#b91c1c,#991b1b);color:#fff;font:800 15px Nunito,system-ui,sans-serif;box-shadow:0 7px 16px rgba(153,27,27,.2);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.sh .location-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(153,27,27,.27);filter:brightness(1.06)}
.sh .location-btn:active{transform:translateY(0)}
.sh .location-btn:disabled{opacity:.7;cursor:wait}
.sh .location-feedback{margin:0 0 14px;padding:9px 12px;border:1px solid #86efac;border-radius:999px;background:#dcfce7;color:#166534;text-align:center;font-size:12px;font-weight:700;animation:locationIn .28s ease both}
.sh .location-feedback.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}
@keyframes locationIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
.sh .delivery-fields{display:grid;gap:5px}
.sh .delivery-fields label{display:block;margin-top:8px;color:#52525b;font-size:13px;font-weight:800}
.sh .delivery-fields input{width:100%;margin:3px 0 5px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#27272a;font:15px Nunito,system-ui,sans-serif;transition:border-color .18s,box-shadow .18s}
.sh .delivery-fields input:focus{outline:0;border-color:#991b1b;box-shadow:0 0 0 3px rgba(153,27,27,.10)}
.sh .privacy-note{margin:13px 2px 15px;color:#71717a;text-align:center;font-size:12px;line-height:1.5}
.sh .confirm-delivery{width:100%;height:48px;margin-top:10px;border:0;border-radius:10px;background:#27272a;color:#fff;font:800 15px Nunito,system-ui,sans-serif;cursor:pointer;transition:background .18s,transform .18s}
.sh .confirm-delivery:hover{background:#1f2937;transform:translateY(-1px)}
@media(max-width:520px){.ov{padding:12px}.sh{width:100%;max-height:calc(100dvh - 24px);padding:21px 18px!important}}

/* Correção: o modal permanece claro mesmo quando o aparelho está em tema escuro */
.sh,.sh *{color-scheme:light}
.sh{background:#fff!important;color:#27272a!important}
.sh h3,.sh h4,.sh p,.sh label,.sh small,.sh span,.sh b,.sh strong{color:inherit}
.sh .r{background:#fff!important;border:1px solid #e5e7eb!important;color:#27272a!important;border-radius:10px!important;box-shadow:none!important}
.sh .r span,.sh .r b{color:#27272a!important}
.sh .seg{display:flex;gap:8px}
.sh .seg button{flex:1;min-width:0;min-height:48px;padding:10px 8px;background:#fff!important;color:#27272a!important;border:1px solid #d4d4d8!important;border-radius:10px!important;font-weight:800}
.sh .seg button.on{background:#fff1f2!important;color:#b91c1c!important;border:2px solid #b91c1c!important;box-shadow:0 0 0 1px rgba(185,28,28,.08)!important}
.sh .b:not(.p){background:#f4f4f5!important;color:#27272a!important;border:1px solid #e4e4e7!important}
.sh .b.p,.sh button.confirm-delivery{background:#b91c1c!important;color:#fff!important;border:0!important}
.sh .delivery-fields input,.sh textarea{background:#fff!important;color:#27272a!important;border-color:#e5e7eb!important}
.sh .privacy-note{color:#71717a!important}
.sh .location-feedback{background:#dcfce7!important;color:#166534!important}
.sh .location-feedback.error{background:#fef2f2!important;color:#991b1b!important}
.sh .x{color:#71717a!important}
