r><small>${E(e.t)}</small></span><label><input type="checkbox" ${e.a?"checked":""} style="width:auto;margin:0 4px" onchange="S.ent[${i}].a=this.checked;render()">Trabalhando hoje</label></div>`).join("")}
<div class="box"><h3 style="margin-top:0">Novo entregador</h3><label>Nome</label><input value="${E(S.ne.n)}" oninput="S.ne.n=this.value"><label>WhatsApp com DDD</label><input type="tel" value="${E(S.ne.t)}" oninput="S.ne.t=this.value"><button class="b p" onclick="addE()">Cadastrar entregador</button></div>`}

return`<div class="ov" onclick="if(event.target==this){S.ck=0;render()}"><div class="sh"><h3 style="margin-top:0">Resumo do pedido</h3>${bag()}<div class="r"><span class="tx">Subtotal</span><b>${R(tot())}</b></div>
<label style="display:block;margin-top:8px">Observações do pedido</label><textarea rows="2" placeholder="Ex.: tirar cebola, mandar sachês" oninput="S.f.obs=this.value">${E(f.obs)}</textarea>
<h4 style="margin:14px 0 6px">Como você quer receber?</h4><div class="seg"><button class="${d?"on":""}" onclick="S.f.tipo='delivery';render()">Delivery</button><button class="${d?"":"on"}" onclick="S.f.tipo='retirada';render()">Retirada no balcão</button></div>
${inp("nome","Nome")}${inp("tel","WhatsApp com DDD","tel").replace('<input ','<input onchange="render()" ')}

<h4 style="margin:14px 0 6px">Pagamento</h4><div class="seg">${["Pix","Cartão na entrega","Dinheiro"].map(o=>`<button class="${f.pay==o?"on":""}" onclick="S.f.pay='${o}';render()">${o}</button>`).join("")}</div>

${S.cb.on&&bal(f.tel)>0?`<label style="display:block;margin-top:8px"><input type="checkbox" style="width:auto;margin:0 6px 0 0" ${f.usar?"checked":""} onchange="S.f.usar=this.checked;render()">Usar meu cashback (${R(bal(f.tel))})</label>`:""}
<div class="r" style="margin-top:12px"><span class="tx">${!d?"Retirada no balcão":fs=="fora"?"Fora da área de entrega":fs=="sem"?"Taxa: compartilhe sua localização":"Taxa de entrega"+(dist()!=null?" ("+dist().toFixed(1)+" km)":"")}</span><b>${R(tx)}</b></div>${ds?`<div class="r"><span class="tx">Cashback usado</span><b>-${R(ds)}</b></div>`:""}<div class="r"><span class="tx"><b>Total</b></span><b>${R(T)}</b></div>
${S.cb.on&&earn({items:ci()})>0?`<small>Você ganha ${R(earn({items:ci()}))} de cashback neste pedido.</small>`:""}${S.lm?`<p style="color:var(--pri)">${S.lm}</p>`:""}
<button class="b p" style="height:46px;margin-top:8px" onclick="send()">Confirmar pedido · ${R(T)}</button></div></div>`};
