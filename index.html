navigator.geolocation.getCurrentPosition(p=>{S.f.loc=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);S.lm="";render()},()=>{S.lm="Não foi possível obter a localização. Libere o acesso à localização no navegador e tente de novo.";render()},{enableHighAccuracy:true,timeout:10000})}

${f.pay=="Pix"?`<p>Chave PIX: <b>${E(CFG.pix_chave)||"não cadastrada"}</b></p><button class="b" onclick="cpk()">Copiar chave PIX</button><small style="color:var(--mut)">Depois de pagar, a equipe confirma o pagamento.</small>`:""}${f.pay=="Dinheiro"?inp("troco","Troco para quanto?","number"):""}
${bal()>0?`<label style="display:block;margin-top:8px"><input type="checkbox" style="width:auto;margin:0 6px 0 0" ${f.usar?"checked":""} onchange="S.f.usar=this.checked;render()">Usar meu cashback (${R(bal())})</label>`:""}
<div class="r" style="margin-top:12px"><span class="tx">${!d?"Retirada no balcão":fs=="fora"?"Fora da área de entrega":fs=="sem"?"Taxa: compartilhe sua localização":"Taxa de entrega"+(dist()!=null?" ("+dist().toFixed(1)+" km)":"")}</span><b>${R(tx)}</b></div>${ds?`<div class="r"><span class="tx">Cashback usado</span><b>-${R(ds)}</b></div>`:""}<div class="r"><span class="tx"><b>Total</b></span><b>${R(T)}</b></div>
${S.cb.on&&earn()>0?`<small>Você ganha ${R(earn())} de cashback neste pedido.</small>`:""}${S.lm?`<p style="color:var(--pri)">${E(S.lm)}</p>`:""}
${!S.open?`<button class="b" disabled>Loja fechada no momento</button>`:tot()<S.min?`<button class="b" disabled>Pedido mínimo: ${R(S.min)}</button>`:`<button class="b p" style="height:46px;margin-top:8px" ${S.busy?"disabled":""} onclick="send()">Confirmar pedido · ${R(T)}</button>`}</div></div>`};

function wa(t,m){let d=dg(t);if(d.length<=11)d="55"+d;window.open("https://wa.me/"+d+"?text="+encodeURIComponent(m),"_blank")}
const msgL=o=>{const p=o.payload,d=p.tipo=="delivery";return`🍔 Novo pedido #${o.numero} (${d?"DELIVERY":"RETIRADA"})\nCliente: ${p.nome} - ${p.telefone}\n${d?`Endereço: ${p.endereco}, ${p.numero_casa} - ${p.bairro}`:"Retirada no balcão"}`+(p.referencia?`\nRef.: ${p.referencia}`:"")+(p.localizacao?`\n📍 https://maps.google.com/?q=${p.localizacao}`:"")+`\n\n${o.itens.join("\n")}`+(p.observacao?`\n\nObs.: ${p.observacao}`:"")+`\n\n💰 ${p.pagto} - ${R(o.total)}`+(p.troco?` (troco para ${R(p.troco)})`:"")};
const ERR=[["loja fechada","A loja está fechada no momento."],["abaixo do minimo","O pedido está abaixo do valor mínimo."],["fora da area","Este endereço está fora da área de entrega."],["localizacao obrigatoria","Compartilhe sua localização para calcular a taxa de entrega."],["indisponivel","Algum item ficou indisponível. Atualize a página e monte o pedido de novo."],["pausada","Uma categoria foi pausada. Atualize a página."],["escolha invalida","Falta escolher uma opção obrigatória de algum item."],["cashback","Para usar o cashback, abra o seu link pessoal."],["endereco incompleto","Preencha endereço, número e bairro."]];

async function send(){const f=S.f,d=f.tipo!="retirada";if(S.busy)return;

S.min=+CFG.pedido_minimo;S.tempo={delivery:CFG.tempo_delivery,retirada:CFG.tempo_retirada};S.cb={on:!!CFG.cashback_ativo,pct:+CFG.cashback_pct};S.open=ab.data!==false;
