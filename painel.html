function resize(file,max,type){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const g=new Image();g.onload=()=>{const k=Math.min(1,max/Math.max(g.width,g.height)),c=document.createElement("canvas");c.width=Math.round(g.width*k);c.height=Math.round(g.height*k);c.getContext("2d").drawImage(g,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("imagem")),type,.85)};g.onerror=()=>rej(new Error("imagem inválida"));g.src=r.result};r.readAsDataURL(file)})}
async function up(path,file,max,type){const b=await resize(file,max,type);const r=await sb.storage.from("deufome").upload(path,b,{upsert:true,contentType:type,cacheControl:"3600"});if(r.error){tst("Erro no envio da foto: "+r.error.message);throw r.error}return sb.storage.from("deufome").getPublicUrl(path).data.publicUrl+"?v="+Date.now()}

ps.forEach((p,pi)=>{const os=D.op.filter(o=>o.produto_id==p.id);h+=`<div class="r ra${c.ativa?"":" off"}">${thumb(p)}<span class="mv"><button onclick="mvP(${c.id},${pi},-1)" aria-label="Subir">↑</button><button onclick="mvP(${c.id},${pi},1)" aria-label="Descer">↓</button></span><span class="tx">${fi("produtos",p.id,"nome",p.nome)}<input value="${E(p.descricao||"")}" placeholder="Descrição" style="margin:4px 0 0" onchange="sv('produtos',${p.id},'descricao',this,'t')"></span><label class="up" title="Foto">📷<input type="file" accept="image/*" hidden onchange="foto(${p.id},this)"></label>${os.length?os.map(o=>`<small>${E(o.nome[0])}</small><input type="number" step="0.5" value="${o.preco}" style="width:78px;margin:0" onchange="svo(${o.id},${p.id},this)">`).join(""):`<input type="number" step="0.5" value="${p.preco}" style="width:90px;margin:0" onchange="sv('produtos',${p.id},'preco',this,'n')">`}<label><input type="checkbox" style="width:auto;margin:0 4px" ${p.ativo?"checked":""} onchange="svb('produtos',${p.id},'ativo',this.checked)">Ativo</label><label><input type="checkbox" style="width:auto;margin:0 4px" ${p.destaque?"checked":""} onchange="svb('produtos',${p.id},'destaque',this.checked)">Destaque</label><select style="max-width:120px;margin:0" onchange="mvTo(${p.id},this.value)" aria-label="Mover para outra categoria">${D.cat.map(c2=>`<option value="${c2.id}"${c2.id==c.id?" selected":""}>${E(c2.nome)}</option>`).join("")}</select><button class="x" onclick="del('produtos',${p.id})">${dl("produtos",p.id)}</button></div>`});
