<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Painel da loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ================= DARK REFINADO ================= */
        :root {
            --bg: #0F1115;
            --col: #181A20;
            --card: #22252E;
            --inp: #22252E;
            --tx: #E8EAED;
            --mut: #9AA0AC;
            --line: #2E323C;
            --pri: #DC2626;
            --ok: #16A34A;
            --warn: #F59E0B;
            --blue: #3B82F6;
            --purple: #8B5CF6;
            --off: #3A3F4B
        }

        :root[data-theme="light"] {
            --bg: #f3f4f6;
            --col: #ffffff;
            --card: #f9fafb;
            --inp: #ffffff;
            --tx: #111827;
            --mut: #6b7280;
            --line: #e5e7eb;
            --off: #d1d5db
        }

        :root[data-c="1"] {
            --bg: #000;
            --col: #000;
            --card: #000;
            --inp: #000;
            --tx: #fff;
            --mut: #eee;
            --line: #fff
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: 70px
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.4 Nunito, system-ui, sans-serif
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit
        }

        :focus-visible {
            outline: 3px solid #60a5fa;
            outline-offset: 2px
        }

        h2 {
            margin: 6px 0 10px;
            font-size: 22px;
            font-weight: 800
        }

        h3 {
            margin: 20px 0 8px;
            font-size: 16px;
            font-weight: 800
        }

        h3.ct {
            margin: 0 0 12px
        }

        h4 {
            margin: 0
        }

        small {
            color: var(--mut)
        }

        a {
            color: #f87171
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        /* ---------- Cabecalho / menu superior ---------- */
        #hd {
            position: sticky;
            top: 0;
            z-index: 9;
            background: var(--col);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 2%;
            padding-top: calc(8px + env(safe-area-inset-top, 0px))
        }

        #hd .brand {
            font-weight: 800;
            font-size: 18px;
            white-space: nowrap
        }

        #nav {
            display: flex;
            gap: 4px;
            align-items: center;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none
        }

        #nav::-webkit-scrollbar {
            display: none
        }

        #nav button,
        #nav a.nl {
            border: 0;
            background: transparent;
            color: var(--mut);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            border-radius: 0
        }

        #nav button:hover,
        #nav a.nl:hover {
            color: var(--tx)
        }

        #nav button.on {
            color: #fff;
            border-bottom-color: var(--pri)
        }

        #nav .sp {
            flex: 1
        }

        #nav em {
            font-style: normal;
            background: var(--pri);
            color: #fff;
            border-radius: 999px;
            padding: 0 7px;
            font-size: 12px;
            font-weight: 800;
            margin-left: 4px
        }

        #nav a.nl {
            color: #fbbf24
        }

        body:not(.in) #hd,
        body:not(.in) #top {
            display: none
        }

        /* ---------- Topo (titulo + pilulas) ---------- */
        #wrap {
            max-width: 1440px;
            width: 96%;
            margin: 0 auto
        }

        #top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 16px 0 10px
        }

        #ttl {
            margin: 0;
            font-size: 26px;
            font-weight: 800
        }

        #ctl {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 0;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap
        }

        .pill.on {
            background: var(--ok)
        }

        .pill.off {
            background: #DC2626
        }

        .pw {
            display: inline-flex;
            align-items: center;
            gap: 4px
        }

        .hp {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--mut);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            padding: 0
        }

        main {
            padding: 4px 0 40px;
            zoom: var(--z, 1)
        }

        /* ---------- Toggle switches ---------- */
        input[type=checkbox] {
            -webkit-appearance: none;
            appearance: none;
            width: 40px !important;
            min-width: 40px;
            height: 22px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 999px;
            background: var(--off);
            position: relative;
            cursor: pointer;
            flex: none;
            transition: background .2s
        }

        input[type=checkbox]::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .4);
            transition: transform .2s
        }

        input[type=checkbox]:checked {
            background: var(--ok)
        }

        input[type=checkbox]:checked::after {
            transform: translateX(18px)
        }

        label:has(>input[type=checkbox]) {
            display: inline-flex !important;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--tx);
            font-weight: 600;
            white-space: nowrap
        }

        /* ---------- Formularios ---------- */
        label {
            font-size: 13px;
            color: var(--mut);
            font-weight: 600
        }

        input:not([type=checkbox]),
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--inp);
            color: var(--tx);
            font-size: 15px;
            margin: 3px 0 8px
        }

        textarea {
            resize: vertical
        }

        .b {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--tx);
            border-radius: 10px;
            min-height: 40px;
            padding: 0 14px;
            width: 100%;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer
        }

        .b.p {
            background: var(--pri);
            color: #fff;
            border-color: var(--pri)
        }

        .b.g {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok)
        }

        .b.bl {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue)
        }

        .b.sm {
            width: auto;
            min-height: 34px;
            font-size: 13px
        }

        .x {
            border: 0;
            background: transparent;
            color: var(--mut);
            font-size: 16px;
            cursor: pointer;
            padding: 6px
        }

        .seg {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap
        }

        .seg button {
            flex: 1;
            min-width: 90px;
            padding: 9px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--tx);
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer
        }

        .seg button.on {
            border-color: var(--pri);
            color: #fff;
            background: var(--pri)
        }

        /* ---------- Blocos ---------- */
        .box {
            background: var(--col);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px
        }

        .r {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .r .tx {
            flex: 1;
            min-width: 0
        }

        .r.off {
            opacity: .45
        }

        .ra {
            flex-wrap: wrap
        }

        .box .r:last-of-type {
            border-bottom: 0
        }

        .mv {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .mv button {
            width: 28px;
            height: 24px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--tx);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            padding: 0
        }

        /* ---------- Kanban ---------- */
        .cols {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            align-items: start
        }

        .col {
            background: var(--col);
            border: 1px solid var(--line);
            border-top: 3px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            min-height: 72vh
        }

        .col.k3 {
            border-top-color: var(--warn)
        }

        .col.k0 {
            border-top-color: var(--blue)
        }

        .col.k2 {
            border-top-color: var(--purple)
        }

        .col.k1 {
            border-top-color: var(--ok)
        }

        .col>h4 {
            margin: 2px 2px 10px;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            justify-content: space-between
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 14px
        }

        .ch1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap
        }

        .ch1 .nm {
            font-size: 16px;
            font-weight: 800
        }

        .bdg {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(245, 158, 11, .2);
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: .2px
        }

        .tag.pg {
            background: rgba(22, 163, 74, .22);
            color: #4ade80
        }

        .tag.dl {
            background: rgba(59, 130, 246, .2);
            color: #60a5fa
        }

        .cn {
            margin: 8px 0 2px;
            font-weight: 800
        }

        .map {
            display: inline-block;
            margin-top: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--col);
            color: var(--tx);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none
        }

        .its {
            list-style: none;
            margin: 8px 0;
            padding: 8px 0;
            border-top: 1px dashed var(--line);
            border-bottom: 1px dashed var(--line)
        }

        .its li {
            padding: 2px 0
        }

        .its b {
            color: #fff
        }

        :root[data-theme="light"] .its b {
            color: #111
        }

        .its em {
            display: block;
            font-style: normal;
            font-size: 12px;
            color: #fbbf24;
            font-weight: 700
        }

        .cf {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap
        }

        .cf b {
            font-size: 16px
        }

        .lk {
            display: block;
            margin: 4px 0;
            color: #f87171;
            font-size: 12px;
            font-weight: 700;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            text-align: left
        }

        .ac {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px
        }

        .ac .b {
            margin: 0;
            min-height: 38px;
            font-size: 13px
        }

        .ac .full {
            grid-column: 1/-1
        }

        .ac select {
            grid-column: 1/-1;
            margin: 0
        }

        /* ---------- Cardapio ---------- */
        .ch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            margin-bottom: 6px;
            flex-wrap: wrap
        }

        .ch input:not([type=checkbox]) {
            margin: 0;
            font-weight: 800;
            flex: 1;
            min-width: 160px
        }

        .ch .mv {
            flex-direction: row
        }

        .pr {
            align-items: flex-start;
            gap: 14px;
            background: var(--col);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px
        }

        .ph {
            flex: none;
            cursor: pointer;
            display: block;
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 10px;
            overflow: hidden
        }

        .im {
            width: 84px;
            height: 84px;
            border-radius: 10px;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: var(--card);
            border: 1px dashed var(--off);
            color: var(--mut)
        }

        img.im {
            border-style: solid
        }

        .hv {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity .15s
        }

        .ph:hover .hv,
        .ph:focus-within .hv {
            opacity: 1
        }

        .pb {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 16px;
            align-items: start
        }

        .pb .tx input {
            margin: 0 0 6px
        }

        .pp {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .pfx {
            display: flex;
            align-items: center;
            background: var(--inp);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding-left: 10px;
            gap: 6px
        }

        .pfx small {
            font-weight: 800;
            white-space: nowrap
        }

        .pfx input {
            border: 0 !important;
            background: transparent !important;
            width: 84px !important;
            margin: 0 !important;
            padding: 10px 8px !important
        }

        .pf {
            grid-column: 1/-1;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap
        }

        .pf select {
            width: auto;
            min-width: 195px;
            margin: 0
        }

        .pf .mv {
            flex-direction: row
        }

        .pf .x {
            margin-left: auto
        }

        /* ---------- Complementos ---------- */
        .gbox {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start
        }

        .gbox .gl,
        .gbox .gr {
            min-width: 0
        }

        .mm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 10px
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--mut);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer
        }

        .chip.on {
            background: var(--pri);
            border-color: var(--pri);
            color: #fff
        }

        .chip.all {
            border-style: dashed;
            color: var(--tx)
        }

        .gh2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px
        }

        /* ---------- Relatorios ---------- */
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px
        }

        .kpi {
            background: var(--col);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            position: relative
        }

        .kpi small {
            display: block;
            font-weight: 700
        }

        .kpi b {
            display: block;
            font-size: 28px;
            font-weight: 800;
            margin-top: 4px
        }

        .kpi i {
            position: absolute;
            right: 14px;
            top: 12px;
            font-style: normal;
            font-size: 22px;
            opacity: .5
        }

        .kpi.ok b {
            color: #4ade80
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: start
        }

        .two>.box {
            margin: 0
        }

        /* ---------- Ajustes ---------- */
        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start
        }

        .g2>.box {
            margin: 0
        }

        .ap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .lg {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid var(--col);
            background: var(--card);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px
        }

        .cap {
            height: 150px;
            background: linear-gradient(135deg, var(--pri), #ff8a5b) center/cover;
            border-radius: 10px
        }

        /* ---------- Modal ---------- */
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 20;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sh {
            background: var(--col);
            border: 1px solid var(--line);
            width: 100%;
            max-width: 560px;
            max-height: 92vh;
            overflow: auto;
            border-radius: 16px 16px 0 0;
            padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px))
        }

        @media(min-width:769px) {
            .ov {
                align-items: center
            }

            .sh {
                border-radius: 16px
            }
        }

        @media(max-width:1200px) {
            .cols {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(max-width:900px) {
            .kpis {
                grid-template-columns: 1fr 1fr
            }

            .two,
            .g2,
            .gbox {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:640px) {
            .cols {
                grid-template-columns: 1fr
            }

            .col {
                min-height: 0
            }

            #hd .brand {
                display: none
            }

            .pill {
                flex: 1;
                padding: 8px 6px;
                font-size: 12px
            }

            .pr {
                flex-wrap: wrap
            }

            .pb {
                grid-template-columns: 1fr
            }

            .pf select {
                min-width: 0;
                flex: 1
            }

            .ch input:not([type=checkbox]) {
                min-width: 100%
            }
        }
    </style>
</head>

<body>
    <header id="hd"><b class="brand">Painel da loja</b>
        <nav id="nav"></nav>
    </header>
    <div id="wrap">
        <div id="top">
            <h1 id="ttl"></h1>
            <div id="ctl"></div>
        </div>
        <main id="app"></main>
    </div>
    <div id="toast"
        style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

        const R = v => "R$ " + Number(v || 0).toFixed(2).replace(".", ","), E = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])), dg = t => (t || "").replace(/\D/g, "");
        const $ = id => document.getElementById(id), DIA = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
        let U = null, D = {cfg: {}, cat: [], pro: [], op: [], gr: [], oc: [], gc: [], fx: [], en: [], ped: []}, TAB = "p", REL = "hoje", REP = null, SOM = false, MODAL = null, CF = "", LMSG = "";
        let AA = localStorage.getItem("dfm_aa") == "1", AP = localStorage.getItem("dfm_ap") == "1";
        const tst = m => {const e = $("toast"); if (e) {e.textContent = m; e.style.display = "block"; clearTimeout(tst.t); tst.t = setTimeout(() => e.style.display = "none", 6000)} };
        async function ok(p) {const r = await p; if (r.error) {tst("Erro: " + r.error.message); throw r.error} return r.data}
        const waUrl = (t, m) => {let d = dg(t); if (d.length <= 11) d = "55" + d; return "https://wa.me/" + d + "?text=" + encodeURIComponent(m)};
        const wa = (t, m) => window.open(waUrl(t, m), "_blank");

        async function svb(t, id, col, v) {await ok(sb.from(t).update({[col]: v}).eq("id", id)); await rf()}
        const fi = (t, id, col, val, ty) => `<input ${ty == "n" || ty == "f" ? 'type="number" step="any"' : ""} value="${E(val ?? "")}" style="margin:0" onchange="sv('${t}',${id},'${col}',this,'${ty || "t"}')">`;
        async function del(t, id, k) {const key = t + id; if (CF !== key) {CF = key; render(); return } CF = ""; await ok(sb.from(t).delete().eq(k || "id", id)); await rf()}
        const dl = (t, id) => CF == t + id ? "Confirmar?" : "🗑";
        async function swap(t, a, b) {if (!a || !b) return; await Promise.all([ok(sb.from(t).update({ordem: b.ordem}).eq("id", a.id)), ok(sb.from(t).update({ordem: a.ordem}).eq("id", b.id))]); await rf()}
        const mvC = (i, d) => swap("categorias", D.cat[i], D.cat[i + d]), mvP = (cid, i, d) => {const l = D.pro.filter(p => p.categoria_id == cid); return swap("produtos", l[i], l[i + d])};
        const mx = l => Math.max(0, ...l.map(x => x.ordem || 0));
        async function addP(cid) {await ok(sb.from("produtos").insert({categoria_id: cid, nome: "Novo item", preco: 0, ativo: false, ordem: mx(D.pro.filter(p => p.categoria_id == cid)) + 1})); await rf()}
        async function addC() {const n = $("nc").value.replace(/["'`<>\\]/g, "").trim(); if (!n) return; await ok(sb.from("categorias").insert({nome: n, ordem: mx(D.cat) + 1})); await rf()}
        async function mvTo(id, cid) {await ok(sb.from("produtos").update({categoria_id: +cid, ordem: mx(D.pro.filter(p => p.categoria_id == cid)) + 1}).eq("id", id)); await rf()}
        async function svo(id, pid, el) {await ok(sb.from("produto_opcoes").update({preco: +el.value || 0}).eq("id", id)); await loadCfg(); const m = Math.min(...D.op.filter(o => o.produto_id == pid).map(o => +o.preco)); await svb("produtos", pid, "preco", m)}
        function resize(file, max, type) {return new Promise((res, rej) => {const r = new FileReader(); r.onload = () => {const g = new Image(); g.onload = () => {const k = Math.min(1, max / Math.max(g.width, g.height)), c = document.createElement("canvas"); c.width = Math.round(g.width * k); c.height = Math.round(g.height * k); c.getContext("2d").drawImage(g, 0, 0, c.width, c.height); c.toBlob(b => b ? res(b) : rej(new Error("imagem")), type, .85)}; g.onerror = () => rej(new Error("imagem inválida")); g.src = r.result}; r.readAsDataURL(file)})}
        async function up(path, file, max, type) {const b = await resize(file, max, type); const r = await sb.storage.from("deufome").upload(path, b, {upsert: true, contentType: type, cacheControl: "3600"}); if (r.error) {tst("Erro no envio da foto: " + r.error.message); throw r.error} return sb.storage.from("deufome").getPublicUrl(path).data.publicUrl + "?v=" + Date.now()}
        async function foto(id, el) {const f = el.files[0]; if (!f) return; await svb("produtos", id, "foto_url", await up("produtos/" + id + ".jpg", f, 800, "image/jpeg"))}
        async function img(col, el, max, type) {const f = el.files[0]; if (!f) return; await svb("config", 1, col, await up("loja/" + col + (type == "image/png" ? ".png" : ".jpg"), f, max, type))}
        const thumb = p => p.foto_url ? `<img class="im" src="${E(p.foto_url)}" alt="">` : `<span class="im">📷</span>`;
        function vM() {
            let h = "<p><small>Edite nomes, descrições e preços, envie fotos, reordene, pause categorias e itens. A alteração vale na hora para os clientes.</small></p>";
            D.cat.forEach((c, ci) => {
                const ps = D.pro.filter(p => p.categoria_id == c.id);
                h += `<div class="ch">${fi("categorias", c.id, "nome", c.nome)}<span class="mv"><button onclick="mvC(${ci},-1)" aria-label="Subir">↑</button><button onclick="mvC(${ci},1)" aria-label="Descer">↓</button></span><label><input type="checkbox" ${c.ativa ? "" : "checked"} onchange="svb('categorias',${c.id},'ativa',!this.checked)">Pausada</label><label><input type="checkbox" ${c.gera_cashback ? "checked" : ""} onchange="svb('categorias',${c.id},'gera_cashback',this.checked)">Cashback</label>${ps.length ? "" : `<button class="x" onclick="del('categorias',${c.id})">${dl("categorias", c.id)}</button>`}</div>`;
                ps.forEach((p, pi) => {const os = D.op.filter(o => o.produto_id == p.id); h += `<div class="r pr${c.ativa ? "" : " off"}"><label class="ph up" title="Alterar foto">${thumb(p)}<span class="hv">Alterar foto</span><input type="file" accept="image/*" hidden onchange="foto(${p.id},this)"></label><div class="pb"><div class="tx">${fi("produtos", p.id, "nome", p.nome)}<input value="${E(p.descricao || "")}" placeholder="Descrição" onchange="sv('produtos',${p.id},'descricao',this,'t')"></div><div class="pp">${os.length ? os.map(o => `<span class="pfx"><small>${E(o.nome[0])} R$</small><input type="number" step="0.5" value="${o.preco}" onchange="svo(${o.id},${p.id},this)"></span>`).join("") : `<span class="pfx"><small>R$</small><input type="number" step="0.5" value="${p.preco}" onchange="sv('produtos',${p.id},'preco',this,'n')"></span>`}</div><div class="pf"><label><input type="checkbox" ${p.ativo ? "checked" : ""} onchange="svb('produtos',${p.id},'ativo',this.checked)">Ativo</label><label><input type="checkbox" ${p.destaque ? "checked" : ""} onchange="svb('produtos',${p.id},'destaque',this.checked)">Destaque</label><select onchange="mvTo(${p.id},this.value)" aria-label="Mover para outra categoria">${D.cat.map(c2 => `<option value="${c2.id}"${c2.id == c.id ? " selected" : ""}>${E(c2.nome)}</option>`).join("")}</select><span class="mv"><button onclick="mvP(${c.id},${pi},-1)" aria-label="Subir">↑</button><button onclick="mvP(${c.id},${pi},1)" aria-label="Descer">↓</button></span><button class="x" onclick="del('produtos',${p.id})">${dl("produtos", p.id)}</button></div></div></div>`});
                h += `<button class="b" onclick="addP(${c.id})">+ Novo item (começa desativado)</button>`
            });
            return h + `<div class="box"><h3 class="ct">Nova categoria</h3><input id="nc" placeholder="Nome da categoria"><button class="b p" onclick="addC()">Criar categoria</button></div>`
        }
        // ---------- complementos
        async function gcat(g, c, on) {await ok(on ? sb.from("grupo_categorias").insert({grupo_id: g, categoria_id: c}) : sb.from("grupo_categorias").delete().eq("grupo_id", g).eq("categoria_id", c)); await rf()}
        async function gall(g) {const have = D.gc.filter(x => x.grupo_id == g).map(x => x.categoria_id), rows = D.cat.filter(c => !have.includes(c.id)).map(c => ({grupo_id: g, categoria_id: c.id})); if (!rows.length) return; await ok(sb.from("grupo_categorias").insert(rows)); await rf()}
        async function addG() {await ok(sb.from("grupos_complemento").insert({nome: "Novo grupo", obrigatorio: false, min_escolhas: 0, max_escolhas: 1, ordem: mx(D.gr) + 1})); await rf()}
        async function addO(g) {await ok(sb.from("opcoes_complemento").insert({grupo_id: g, nome: "Nova opção", preco: 0, ordem: mx(D.oc.filter(o => o.grupo_id == g)) + 1})); await rf()}
        function vG() {return `<p><small>Crie grupos de escolhas (adicionais, molho, ponto da carne...), marque se são obrigatórios ou opcionais, e escolha em quais categorias aparecem.</small></p>${D.gr.map(g => {const os = D.oc.filter(o => o.grupo_id == g.id); return `<div class="box gbox"><div class="gl"><label>Nome do grupo</label>${fi("grupos_complemento", g.id, "nome", g.nome)}<div class="seg" style="margin-top:8px"><button class="${g.obrigatorio ? "on" : ""}" onclick="svb('grupos_complemento',${g.id},'obrigatorio',true)">Obrigatório</button><button class="${g.obrigatorio ? "" : "on"}" onclick="svb('grupos_complemento',${g.id},'obrigatorio',false)">Opcional</button></div><div class="mm"><div><label>Mínimo</label>${fi("grupos_complemento", g.id, "min_escolhas", g.min_escolhas, "n")}</div><div><label>Máximo</label>${fi("grupos_complemento", g.id, "max_escolhas", g.max_escolhas, "n")}</div></div><label style="display:inline-flex;margin-top:10px"><input type="checkbox" ${g.ativo ? "checked" : ""} onchange="svb('grupos_complemento',${g.id},'ativo',this.checked)">Grupo ativo</label><label style="display:block;margin-top:10px">Aparece nas categorias</label><div class="chips"><button class="chip all" onclick="gall(${g.id})">Marcar todas</button>${D.cat.map(c => {const on = D.gc.some(x => x.grupo_id == g.id && x.categoria_id == c.id); return `<button class="chip ${on ? "on" : ""}" onclick="gcat(${g.id},${c.id},${!on})">${E(c.nome)}</button>`}).join("")}</div></div><div class="gr"><div class="gh2"><h4>Opções</h4><button class="b p sm" onclick="addO(${g.id})">+ Adicionar opção</button></div>${os.map(o => `<div class="r ra"><span class="tx">${fi("opcoes_complemento", o.id, "nome", o.nome)}</span><span class="pfx"><small>R$</small><input type="number" step="0.5" value="${o.preco}" onchange="sv('opcoes_complemento',${o.id},'preco',this,'n')"></span><label><input type="checkbox" ${o.ativo ? "checked" : ""} onchange="svb('opcoes_complemento',${o.id},'ativo',this.checked)">Ativa</label><button class="x" onclick="del('opcoes_complemento',${o.id})">${dl("opcoes_complemento", o.id)}</button></div>`).join("") || "<small>Nenhuma opção ainda.</small>"}<button class="b" style="color:#f87171;margin-top:12px" onclick="del('grupos_complemento',${g.id})">${CF == "grupos_complemento" + g.id ? "Confirmar exclusão?" : "Excluir grupo"}</button></div></div>`}).join("")}<button class="b p" style="margin-top:12px" onclick="addG()">+ Novo grupo de complemento</button>`}
        // ---------- relatorios
        async function loadRel() {const n = new Date(), ini = REL == "hoje" ? new Date(n.getFullYear(), n.getMonth(), n.getDate()) : REL == "7d" ? new Date(n - 6048e5) : REL == "30d" ? new Date(n - 2592e6) : new Date(2000, 0, 1); const r = await sb.rpc("relatorio", {p_ini: ini.toISOString(), p_fim: new Date(Date.now() + 864e5).toISOString()}); if (r.error) tst("Erro: " + r.error.message); REP = r.data; render()}
        function vR() {const x = REP || {pedidos: 0, total: 0, ticket_medio: 0, cancelados: 0, por_pagamento: [], mais_vendidos: []}; return `<div class="seg">${[["hoje", "Hoje"], ["7d", "7 dias"], ["30d", "30 dias"], ["tudo", "Tudo"]].map(([k, t]) => `<button class="${REL == k ? "on" : ""}" onclick="REL='${k}';loadRel()">${t}</button>`).join("")}</div><div class="kpis"><div class="kpi"><i>🧾</i><small>Pedidos</small><b>${x.pedidos}</b></div><div class="kpi ok"><i>💰</i><small>Vendas</small><b>${R(x.total)}</b></div><div class="kpi"><i>📈</i><small>Ticket médio</small><b>${R(x.ticket_medio)}</b></div><div class="kpi"><i>✖️</i><small>Cancelados</small><b>${x.cancelados}</b></div></div><div class="two"><div class="box"><h3 class="ct">Por forma de pagamento</h3>${x.por_pagamento.map(p => `<div class="r"><span class="tx">${E(PAG[p.forma] || p.forma)} (${p.qtd})</span><b>${R(p.total)}</b></div>`).join("") || "<small>Sem vendas no período.</small>"}</div><div class="box"><h3 class="ct">Mais vendidos</h3>${x.mais_vendidos.map((p, i) => `<div class="r"><span class="tx">${i + 1}. ${E(p.nome)}</span><b>${p.qtd}</b></div>`).join("") || "<small>Sem vendas no período.</small>"}</div></div>`}
        // ---------- ajustes
        const hs = () => Array.isArray(D.cfg.horarios) && D.cfg.horarios.length == 7 ? D.cfg.horarios : DIA.map(() => ({on: true, ini: "18:00", fim: "23:00"}));
        async function sh(i, k, v) {const a = hs().map(x => ({...x})); a[i][k] = v; await svb("config", 1, "horarios", a)}
        const fc = (col, label, ty) => `<label>${label}</label>${fi("config", 1, col, D.cfg[col], ty)}`;
        const cb = (col, label) => `<label style="display:block;margin-top:6px"><input type="checkbox" ${D.cfg[col] ? "checked" : ""} onchange="svb('config',1,'${col}',this.checked)">${label}</label>`;
        async function fxu(km, col, el) {await ok(sb.from("faixas_entrega").update({[col]: +el.value}).eq("km_ate", km)); await rf()}
        async function fxa() {const m = Math.max(0, ...D.fx.map(f => +f.km_ate)); if (m >= 50) {tst("O máximo é 50 km"); return } await ok(sb.from("faixas_entrega").insert({km_ate: Math.min(50, m + 1), taxa: 0})); await rf()}
        async function addE() {const n = $("ne").value.trim(), t = $("nt").value.trim(); if (!n || !t) return; await ok(sb.from("entregadores").insert({nome: n, whatsapp: t})); await rf()}
        function locLoja() {if (!navigator.geolocation) {tst("Este navegador não permite localização"); return } navigator.geolocation.getCurrentPosition(async p => {await ok(sb.from("config").update({loja_lat: +p.coords.latitude.toFixed(6), loja_lng: +p.coords.longitude.toFixed(6)}).eq("id", 1)); await rf()}, () => tst("Não foi possível obter a localização"), {enableHighAccuracy: true, timeout: 10000})}
        async function trocaSenha() {const p = $("np").value; if (p.length < 8) {tst("Use pelo menos 8 caracteres"); return } const r = await sb.auth.updateUser({password: p}); if (r.error) {tst("Erro: " + r.error.message); return } $("np").value = ""; tst("Senha alterada com sucesso")}
        function vE() {
            const c = D.cfg; return `<div class="g2">
<div class="box"><h3 class="ct">Loja</h3>${fc("nome_loja", "Nome da loja")}${fc("loja_whatsapp", "WhatsApp da lanchonete (com DDD)")}${fc("pix_chave", "Chave PIX")}<label>Logo (quadrada)</label><label class="b" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Escolher logo<input type="file" accept="image/*" hidden onchange="img('logo_url',this,400,'image/png')"></label>${c.logo_url ? `<img class="lg" src="${E(c.logo_url)}" alt="Logo" style="margin-top:8px">` : ""}<label style="display:block;margin-top:8px">Capa (imagem larga)</label><label class="b" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Escolher capa<input type="file" accept="image/*" hidden onchange="img('capa_url',this,1600,'image/jpeg')"></label>${c.capa_url ? `<div class="cap" style="background-image:url(${E(c.capa_url)});margin:8px 0 0"></div>` : ""}</div>
<div class="box"><h3 class="ct">Aparência</h3><div class="ap"><button class="b" onclick="zm(-1)" aria-label="Diminuir letra">A−</button><button class="b" onclick="zm(1)" aria-label="Aumentar letra">A+</button><button class="b" onclick="ct()" aria-label="Alto contraste">◑ Alto contraste</button><button class="b" onclick="th()" aria-label="Alternar modo claro e escuro">🌓 Escuro / claro</button></div></div>
<div class="box"><h3 class="ct">Funcionamento</h3>${cb("fechada_manual", "Fechar a loja agora (volta ao normal ao desmarcar)")}${cb("usa_horario", "Usar horário de funcionamento (fuso de Cuiabá)")}${c.usa_horario ? hs().map((h, i) => `<div class="r ra"><span class="tx">${DIA[i]}</span><label><input type="checkbox" ${h.on ? "checked" : ""} onchange="sh(${i},'on',this.checked)">Abre</label><input type="time" value="${h.ini}" style="width:110px;margin:0" onchange="sh(${i},'ini',this.value)"><input type="time" value="${h.fim}" style="width:110px;margin:0" onchange="sh(${i},'fim',this.value)"></div>`).join("") : ""}${fc("pedido_minimo", "Pedido mínimo (R$)", "n")}${fc("tempo_delivery", "Tempo estimado de delivery")}${fc("tempo_retirada", "Tempo estimado de retirada")}</div>
<div class="box"><h3 class="ct">Entrega por distância</h3><small>Cada faixa vale até aquela distância (em linha reta, da loja até o cliente). Acima da última faixa, o endereço fica fora da área de entrega.</small>${D.fx.map(f => `<div class="r ra"><span class="tx">até <input type="number" step="0.5" value="${f.km_ate}" style="width:80px;margin:0 4px" onchange="fxu(${f.km_ate},'km_ate',this)"> km</span>R$ <input type="number" step="0.5" value="${f.taxa}" style="width:80px;margin:0" onchange="fxu(${f.km_ate},'taxa',this)"><button class="x" onclick="del('faixas_entrega',${f.km_ate},'km_ate')">${dl("faixas_entrega", f.km_ate)}</button></div>`).join("")}<button class="b" onclick="fxa()">+ Nova faixa</button><label style="display:block;margin-top:8px">Localização da lanchonete</label>${fi("config", 1, "loja_lat", c.loja_lat, "f")}<div style="height:6px"></div>${fi("config", 1, "loja_lng", c.loja_lng, "f")}<button class="b" style="margin-top:6px" onclick="locLoja()">📍 Usar minha localização atual (estou na lanchonete)</button>${fc("taxa_entrega_padrao", "Taxa usada enquanto a localização da lanchonete não estiver cadastrada (R$)", "n")}</div>
<div class="box"><h3 class="ct">Cashback</h3>${cb("cashback_ativo", "Ativar cashback")}${fc("cashback_pct", "Percentual sobre os itens (%)", "n")}<small>Vale para as categorias marcadas com "Cashback" no Cardápio. É creditado quando o pedido vai para Concluído, e o cliente usa pelo link pessoal.</small></div>
<div class="box"><h3 class="ct">Entregadores</h3>${D.en.map(e => `<div class="r ra"><span class="tx">${fi("entregadores", e.id, "nome", e.nome)}</span><span class="tx">${fi("entregadores", e.id, "whatsapp", e.whatsapp)}</span><label><input type="checkbox" ${e.ativo ? "checked" : ""} onchange="svb('entregadores',${e.id},'ativo',this.checked)">Trabalhando</label><button class="x" onclick="del('entregadores',${e.id})">${dl("entregadores", e.id)}</button></div>`).join("")}<label>Novo entregador</label><input id="ne" placeholder="Nome"><input id="nt" type="tel" placeholder="WhatsApp com DDD"><button class="b p" onclick="addE()">Cadastrar entregador</button></div>
<div class="box"><h3 class="ct">Impressora deste computador</h3><label>Largura do papel</label><select onchange="localStorage.setItem('dfm_mm',this.value)"><option value="80"${localStorage.getItem("dfm_mm") != "58" ? " selected" : ""}>80 mm</option><option value="58"${localStorage.getItem("dfm_mm") == "58" ? " selected" : ""}>58 mm</option></select><small>${E(HELP)}</small></div>
<div class="box"><h3 class="ct">Segurança</h3><p>Conectado como <b>${E(U.email)}</b> (${E(U.papel)})</p><label>Nova senha (mínimo 8 caracteres)</label><input id="np" type="password" autocomplete="new-password"><button class="b p" onclick="trocaSenha()">Trocar senha</button></div>
</div>`}
        // ---------- tela
        const NV = [["p", "Pedidos"], ["m", "Cardápio"], ["g", "Complementos"], ["r", "Relatórios"]], TT = {p: "Pedidos", m: "Cardápio", g: "Complementos", r: "Relatórios", e: "Ajustes"};
        function tab(k) {TAB = k; CF = ""; if (k == "r") return loadRel(); render(); scrollTo(0, 0)}
        function render() {
            const y = scrollY, m0 = document.querySelector(".sh"), st0 = m0 ? m0.scrollTop : 0, n = D.ped.filter(o => o.status == "recebido").length;
            document.body.classList.toggle("in", !!U);
            $("nav").innerHTML = U ? NV.map(([k, t]) => `<button class="${TAB == k ? "on" : ""}" onclick="tab('${k}')">${t}${k == "p" && n ? ` <em>${n}</em>` : ""}</button>`).join("") + `<div class="sp"></div><a class="nl" href="motoboy.html" target="_blank" rel="noopener">🛵 Tela Motoboy</a><button class="${TAB == "e" ? "on" : ""}" onclick="tab('e')">Ajustes</button><button onclick="sair()">Sair</button>` : "";
            $("ttl").textContent = TT[TAB] || "";
            $("ctl").innerHTML = U ? ctlH() : "";
            $("app").innerHTML = U ? ({p: vP, m: vM, g: vG, r: vR, e: vE})[TAB]() + mod() : loginH();
            scrollTo(0, y); const m1 = document.querySelector(".sh"); if (m1) m1.scrollTop = st0; document.title = (U && n ? "(" + n + ") " : "") + "Painel da loja"
        }
        let Z = 1; function zm(d) {Z = Math.min(1.4, Math.max(.9, Z + d * .1)); document.documentElement.style.setProperty("--z", Z)}
        function ct() {const r = document.documentElement; r.dataset.c = r.dataset.c == "1" ? "0" : "1"}
        function th() {const r = document.documentElement; r.dataset.theme = r.dataset.theme == "light" ? "dark" : "light"}
        (async () => {try {const s = await sb.auth.getSession(); if (s.data && s.data.session) {await start(s.data.session.user); return } } catch (e) { } render()})();
    </script>
