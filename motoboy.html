<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Entregas</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#000;--mut:#333;--line:#000;--pri:#B00020;--ok:#0A7A2F;--blue:#0B4FC4;--warn:#FFD400}
*{box-sizing:border-box}
body{margin:0;background:#EDEDED;color:var(--tx);font:17px/1.4 Nunito,system-ui,sans-serif;font-weight:700}
button,input{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:#000;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header b{font-size:22px;font-weight:900;margin-right:auto}
header button,header a{background:#fff;color:#000;border:0;border-radius:10px;padding:10px 12px;font-weight:900;font-size:14px;text-decoration:none;cursor:pointer}
header button.on{background:var(--ok);color:#fff}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom,0px))}
.cnt{font-size:15px;color:var(--mut);margin:4px 2px 10px}
.card{background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-size:34px;font-weight:900}
.badge{border-radius:10px;padding:6px 12px;font-weight:900;font-size:16px}
.badge.pago{background:var(--ok);color:#fff}
.badge.cob{background:var(--warn);color:#000;border:2px solid #000}
.cli{font-size:22px;font-weight:900;margin-top:6px}
.addr{font-size:19px;margin:6px 0;font-weight:800}
.ref{color:var(--mut);font-size:15px}
.its{list-style:none;margin:10px 0;padding:10px 0;border-top:2px dashed #000;border-bottom:2px dashed #000;font-size:18px}
.its li{padding:2px 0}.its em{display:block;font-style:normal;font-size:15px;background:#000;color:#fff;border-radius:6px;padding:2px 8px;margin:2px 0;width:fit-content}
.val{font-size:26px;font-weight:900;margin:6px 0}
.val small{display:block;font-size:15px;font-weight:700;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:56px;border-radius:14px;border:3px solid #000;background:#fff;color:#000;font-size:17px;font-weight:900;text-decoration:none;cursor:pointer;padding:0 8px;width:100%}
.btn.wa{background:#25D366}
.btn.mp{background:var(--blue);color:#fff}
.btn.ok{grid-column:1/-1;min-height:68px;font-size:21px;background:var(--ok);color:#fff}
.btn.ok.c{background:var(--warn);color:#000}
.empty{text-align:center;padding:40px 10px;font-size:20px;color:var(--mut)}
#toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:92vw}
</style>
</head>
<body>
<header id="hd">
  <b>🛵 Entregas</b>
  <button id="bs" onclick="togSom()">🔔 Som: desligado</button>
  <button onclick="load()">↻ Atualizar</button>
</header>
<main id="app"><div class="empty">Conectando...</div></main>
<div id="toast"></div>

<script src="https://jsdelivr.net"></script>
<script>
const SB_URL = "https://supabase.co";
const SB_KEY = "sb_publishable_WBNR6zdxRl7b2BjhFUwDbw_345oI6pa";
const sb = supabase.createClient(SB_URL, SB_KEY);

// Credenciais automáticas (invisíveis para o motoboy)
const AUTO_EMAIL = "motoboy@deufome.com";
const AUTO_PASS  = "123456"; // <--- Mesma senha definida no painel do Supabase

const R = v => "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
const E = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dg = t => (t || "").replace(/\D/g, "");
const $ = id => document.getElementById(id);

const PAG = {pix: "Pix", cartao: "Cartão na entrega", dinheiro: "Dinheiro"};

let U = null, L = [], SOM = false, SEEN = null, LMSG = "", RT = null, busy = false;

const tst = m => {
  const e = $("toast");
  e.textContent = m;
  e.style.display = "block";
  clearTimeout(tst.t);
  tst.t = setTimeout(() => e.style.display = "none", 5000);
};

const lsAdd = (k, id) => {
  try {
    const a = JSON.parse(localStorage.getItem(k) || "[]");
    if (!a.includes(id)) {
      a.push(id);
      localStorage.setItem(k, JSON.stringify(a.slice(-500)));
    }
  } catch (e) {}
};

async function upd(id, patch) {
  const r = await sb.from("pedidos").update(patch).eq("id", id);
  if (!r.error) return;
  if ("pronto" in patch && /column|schema|pronto/i.test(r.error.message || "")) {
    const p2 = {...patch};
    delete p2.pronto;
    lsAdd("dfm_pronto", id);
    const r2 = await sb.from("pedidos").update(p2).eq("id", id);
    if (r2.error) throw r2.error;
    return;
  }
  throw r.error;
}

// Som Super Mario (warp pipe) — Web Audio
let ac;
function tocarSomMarioPipe() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    ac = ac || new A();
    if (ac.state == "suspended") ac.resume();
    const t0 = ac.currentTime + .02;
    [[740,330],[587,262],[440,196]].forEach(([f1,f2], i) => {
      const t = t0 + i * .17, o = ac.createOscillator(), g = ac.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + .14);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.12, t + .01);
      g.gain.setValueAtTime(.12, t + .11);
      g.gain.exponentialRampToValueAtTime(.0001, t + .15);
      o.connect(g);
      g.connect(ac.destination);
      o.start(t);
      o.stop(t + .16);
    });
  } catch (e) {}
}

function setSom(v) {
  SOM = v;
  $("bs").textContent = "🔔 Som: " + (SOM ? "ligado" : "desligado");
  $("bs").classList.toggle("on", SOM);
}
function togSom() { setSom(!SOM); tocarSomMarioPipe(); }

async function start(u) {
  const s = await sb.from("staff").select("user_id,papel").eq("user_id", u.id).maybeSingle();
  if (!s.data) {
    LMSG = "Conta sem permissão na tabela staff.";
    draw();
    return;
  }
  U = u;
  LMSG = "";
  draw();
  setSom(true);
  await load();
  subRT();
}

// Carrega pedidos com status "saiu"
async function load() {
  if (!U) return;
  const r = await sb.from("pedidos")
    .select("*, pedido_itens(*)")
    .eq("tipo", "delivery")
    .eq("status", "saiu")
    .order("criado_em", {ascending: true});
    
  if (r.error) {
    tst("Erro ao carregar: " + r.error.message);
    return;
  }
  L = (r.data || []).filter(o => o.arquivado !== true);
  const ids = new Set(L.map(o => o.id));
  if (SEEN && SOM && [...ids].some(i => !SEEN.has(i))) tocarSomMarioPipe();
  SEEN = ids;
  draw();
}

function subRT() {
  if (RT) return;
  RT = sb.channel("moto")
    .on("postgres_changes", {event: "*", schema: "public", table: "pedidos"}, () => {
      clearTimeout(subRT.t);
      subRT.t = setTimeout(() => { if (U) load(); }, 400);
    })
    .subscribe();
  setInterval(() => { if (U && !busy) load(); }, 15000);
}

const mapU = o => o.localizacao
  ? "https://google.com" + encodeURIComponent(o.localizacao)
  : "https://google.com" + encodeURIComponent(`${o.endereco}, ${o.numero_casa} - ${o.bairro}`);

const waU = o => {
  let d = dg(o.telefone);
  if (d.length <= 11) d = "55" + d;
  return "https://wa.me" + d + "?text=" + encodeURIComponent(`Olá, ${o.nome}! Sou o entregador do pedido #${o.numero}, estou a caminho.`);
};

const itLi = i => {
  const comps = (i.complementos || []).map(c => typeof c === "string" ? c : c.nome).filter(Boolean).join(", ");
  return `<li><b>${i.qtd}x</b> ${E(i.nome)}${comps ? `<em>${E(comps)}</em>` : ""}${i.obs ? `<em>Obs: ${E(i.obs)}</em>` : ""}</li>`;
};

async function entregar(id, num) {
  if (busy) return;
  if (!confirm(`Confirmar entrega do pedido #${num}?`)) return;
  busy = true;
  try {
    await upd(id, {status: "entregue"});
    tst(`Pedido #${num} finalizado!`);
    await load();
  } catch (e) {
    tst("Erro: " + (e.message || e));
  } finally {
    busy = false;
  }
}

function cardH(o) {
  const pago = o.pago === true || o.forma_pagamento === "pix";
  const pagTxt = PAG[o.forma_pagamento] || o.forma_pagamento || "Não informado";
  const troco = o.troco_para ? ` (Troco p/ ${R(o.troco_para)})` : "";
  const itens = (o.pedido_itens || []).map(itLi).join("");

  return `<div class="card">
    <div class="top">
      <span class="num">#${E(o.numero)}</span>
      <span class="badge ${pago ? "pago" : "cob"}">${pago ? "✅ JÁ PAGO" : "💰 COBRAR NA ENTREGA"}</span>
    </div>
    <div class="cli">${E(o.nome)}</div>
    <div class="addr">📍 ${E(o.endereco)}, ${E(o.numero_casa)} - ${E(o.bairro)}</div>
    ${o.complemento ? `<div class="ref">Comp: ${E(o.complemento)}</div>` : ""}
    ${o.referencia ? `<div class="ref">Ref: ${E(o.referencia)}</div>` : ""}
    <ul class="its">${itens}</ul>
    <div class="val">
      ${R(o.total)}
      <small>${E(pagTxt)}${E(troco)}</small>
    </div>
    <div class="row">
      <a class="btn wa" href="${waU(o)}" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="btn mp" href="${mapU(o)}" target="_blank" rel="noopener">🗺️ Mapa</a>
      <button class="btn ok ${pago ? "" : "c"}" onclick="entregar('${o.id}', '${E(o.numero)}')">
        ${pago ? "✅ Confirmar Entrega" : "💰 Recebi e Entreguei"}
      </button>
    </div>
  </div>`;
}

function draw() {
  if (!U) {
    $("app").innerHTML = `<div class="empty">${LMSG ? `<span style="color:var(--pri)">${E(LMSG)}</span>` : "Conectando ao sistema..."}</div>`;
    return;
  }
  if (!L.length) {
    $("app").innerHTML = `<div class="empty">Nenhuma entrega pendente no momento.<br><small>Aguardando novos pedidos...</small></div>`;
    return;
  }
$("app").innerHTML = <div class="cnt">${L.length} entrega(s) na rota</div> + L.map(cardH).join("");
}
// Conecta automaticamente ao abrir a página
async function autoConnect() {
const {data} = await sb.auth.getSession();
if (data.session?.user) {
await start(data.session.user);
return;
}
const r = await sb.auth.signInWithPassword({ email: AUTO_EMAIL, password: AUTO_PASS });
if (r.error) {
LMSG = "Erro de conexão automática: verifique o usuário/senha no Supabase.";
draw();
return;
}
await start(r.data.user);
}
autoConnect();
